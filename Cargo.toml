[package]
name = "revm-inspectors"
description = "Seismic Revm inspector implementations"
version = "0.29.0"
edition = "2021"
rust-version = "1.86.0"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/SeismicSystems/seismic-revm-inspectors"
repository = "https://github.com/SeismicSystems/seismic-revm-inspectors"
categories = ["cryptography"]
keywords = ["ethereum", "evm", "inspectors", "tracing", "debugging"]
exclude = [
    ".github",
    "scripts",
    "testdata",
    "tests",
    "cliff.toml",
    "deny.toml",
    "release.toml",
]

[lints]
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.unreachable_pub = "warn"
rust.unused_must_use = "deny"
rust.rust_2018_idioms = "deny"
rustdoc.all = "warn"
clippy.lint_groups_priority = "allow"

[dependencies]
# eth
alloy-rpc-types-eth = { version = "=1.1.0", default-features = false }
alloy-rpc-types-trace = { version = "=1.1.0", default-features = false }
alloy-sol-types = { version = "1.2", default-features = false }
alloy-primitives = { version = "1.2", default-features = false, features = [
    "map",
] }
revm = { version = "29.0.0", default-features = false }

anstyle = { version = "1.0", optional = true }
colorchoice = "1.0"
thiserror = { version = "2.0", default-features = false }

# serde
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
snapbox = { version = "0.6", features = ["term-svg"] }

[features]
default = ["std"]
std = [
    "alloy-primitives/std",
    "anstyle/std",
    "serde/std",
    "serde_json/std",
    "revm/std",
    "thiserror/std",
]
serde = ["dep:serde", "revm/serde"]
# Seismic Note: we keep the js-tracer feature because of transitive dependency hell (we didn't fork alloy), but completely disable it since
# it gives caller-supplied JavaScript arbitrary live access to stack, memory, and storage during execution, which is incompatible with Seismic's privacy model.
js-tracer = []

[patch.crates-io]
alloy-primitives = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "994f7b3fbc4582c2e06a00d03c7f3fe476b1b7c7" }
alloy-json-abi = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "994f7b3fbc4582c2e06a00d03c7f3fe476b1b7c7" }
alloy-sol-macro-expander = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "994f7b3fbc4582c2e06a00d03c7f3fe476b1b7c7" }
alloy-sol-macro-input = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "994f7b3fbc4582c2e06a00d03c7f3fe476b1b7c7" }
alloy-sol-types = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "994f7b3fbc4582c2e06a00d03c7f3fe476b1b7c7" }
alloy-sol-type-parser = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", rev = "994f7b3fbc4582c2e06a00d03c7f3fe476b1b7c7" }

# Pin alloy crates to upstream v1.1.0 tag so they build against our patched alloy-primitives
alloy-consensus = { git = "https://github.com/alloy-rs/alloy", tag = "v1.1.0" }
alloy-eips = { git = "https://github.com/alloy-rs/alloy", tag = "v1.1.0" }
alloy-serde = { git = "https://github.com/alloy-rs/alloy", tag = "v1.1.0" }
alloy-network-primitives = { git = "https://github.com/alloy-rs/alloy", tag = "v1.1.0" }
alloy-rpc-types-eth = { git = "https://github.com/alloy-rs/alloy", tag = "v1.1.0" }
alloy-rpc-types-trace = { git = "https://github.com/alloy-rs/alloy", tag = "v1.1.0" }

# Pointing to veridise-audit-feb-2026 until we merge it.
revm = { git = "https://github.com/SeismicSystems/seismic-revm.git", rev = "e2915bad927dc3e6239498716241ed41ea91de4c" }
revm-primitives = { git = "https://github.com/SeismicSystems/seismic-revm.git", rev = "e2915bad927dc3e6239498716241ed41ea91de4c" }
